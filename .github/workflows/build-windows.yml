name: Build Windows Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download Poppins Bold
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf' -OutFile assets/Poppins-Bold.ttf
      - name: Generate SOWN icon
        run: python make_icon.py
      - name: Validate Python
        run: python -m compileall -q app.py focus_engine.py
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SOWN_Focus_Manager --add-data "assets;assets" --hidden-import pystray._win32 --icon assets/app.ico app.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package single installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" installer.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SOWN-Focus-Manager-Setup
          path: installer_output/SOWN_Focus_Manager_Setup.exe
          if-no-files-found: error
